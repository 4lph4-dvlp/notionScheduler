[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notion-scheduler"
version = "0.1.0"
description = "Independent direct-API client for personal Notion Scheduler tasks"
requires-python = ">=3.11"
dependencies = ["notion-client>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/notion_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
