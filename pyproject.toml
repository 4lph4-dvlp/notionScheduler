[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notionScheduler"
version = "0.2.0"
description = "Independent direct-API client for personal Notion Scheduler tasks"
requires-python = ">=3.11"
dependencies = ["notion-client>=3.1,<4", "python-dotenv>=1,<2"]

[project.scripts]
notionScheduler = "notion_scheduler.cli:main"
notion-scheduler = "notion_scheduler.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/notion_scheduler"]

[tool.hatch.build.targets.wheel.force-include]
"skills/notion-scheduler/SKILL.md" = "notion_scheduler/skill/SKILL.md"
"skills/notion-scheduler/JSON_CONTRACT.md" = "notion_scheduler/skill/JSON_CONTRACT.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
